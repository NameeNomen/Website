<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegance - Photographer Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- Script Netlify Identity: Wajib buat sistem login admin nanti -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        'luxe-black': '#111111',
                        'luxe-gray': '#F5F5F5',
                        'luxe-accent': '#D4AF37',
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        .image-overlay { background: linear-gradient(to top, rgba(17,17,17,0.8) 0%, rgba(17,17,17,0) 50%); }
        .loader { border: 2px solid #F5F5F5; border-top: 2px solid #D4AF37; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="font-sans bg-white text-luxe-black antialiased selection:bg-luxe-accent selection:text-white">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 bg-white/90 backdrop-blur-md border-b border-gray-100 transition-all duration-300" id="navbar">
        <div class="max-w-7xl mx-auto px-6 lg:px-12">
            <div class="flex justify-between items-center h-20">
                <a href="#" class="font-serif text-2xl tracking-widest uppercase font-semibold">Lensa<span class="text-luxe-accent">.</span></a>
                <div class="hidden md:flex space-x-8 text-sm tracking-widest uppercase">
                    <a href="#work" class="hover:text-gray-500 transition-colors">Karya</a>
                    <a href="#about" class="hover:text-gray-500 transition-colors">Profil</a>
                    <a href="#contact" class="hover:text-gray-500 transition-colors">Kontak</a>
                </div>
                <button class="md:hidden focus:outline-none" id="mobile-menu-btn">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="relative h-screen flex items-center justify-center overflow-hidden">
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80" alt="Hero" class="w-full h-full object-cover object-top filter brightness-[0.85] grayscale-[30%]">
        </div>
        <div class="relative z-10 text-center px-4 max-w-4xl mx-auto mt-20">
            <h2 class="text-sm md:text-base tracking-[0.3em] uppercase text-white mb-6 font-light">Eksklusif & Abadi</h2>
            <h1 class="font-serif text-5xl md:text-7xl lg:text-8xl text-white leading-tight mb-8 drop-shadow-lg">
                Menangkap <br> <span class="italic font-light">Kemewahan</span> Momen
            </h1>
            <a href="#work" class="inline-block border border-white text-white px-10 py-4 uppercase tracking-widest text-xs hover:bg-white hover:text-luxe-black transition-all duration-500">
                Lihat Portofolio
            </a>
        </div>
    </section>

    <!-- Portfolio Grid (Dinamis via Decap CMS) -->
    <section id="work" class="py-24 bg-luxe-gray px-4 md:px-8">
        <div class="max-w-7xl mx-auto">
            <div class="flex justify-between items-end mb-12">
                <h2 class="font-serif text-4xl md:text-5xl">Karya Terpilih</h2>
                <span class="text-xs uppercase tracking-widest text-gray-500" id="portfolio-status">Live Archive</span>
            </div>
            
            <div id="portfolio-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6 min-h-[400px] flex items-center justify-center">
                <!-- Loader -->
                <div class="col-span-full flex flex-col items-center justify-center space-y-4 text-gray-400">
                    <div class="loader"></div>
                    <p class="uppercase tracking-widest text-xs">Memuat Karya...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-black py-8 text-center">
        <p class="text-gray-600 text-xs tracking-widest uppercase">&copy; 2026 Lensa Photography.</p>
    </footer>

    <script>
        // Navbar scroll effect
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('navbar');
            if (window.scrollY > 50) { nav.classList.add('py-0'); } else { nav.classList.remove('py-0'); }
        });

        // FETCH DATA DARI JSON LOKAL (CRUD DECAP CMS)
        async function fetchPortfolio() {
            const grid = document.getElementById('portfolio-grid');
            try {
                // Sekarang kita narik dari folder data/portfolio.json bukan Contentful
                const response = await fetch('data/portfolio.json');
                if (!response.ok) throw new Error('File data tidak ditemukan');
                
                const data = await response.json();
                const items = data.items || [];

                setTimeout(() => {
                    grid.classList.remove('min-h-[400px]', 'flex', 'items-center', 'justify-center');
                    if (items.length === 0) {
                        grid.innerHTML = '<p class="text-gray-400">Belum ada karya yang diunggah.</p>';
                        return;
                    }

                    grid.innerHTML = items.map((item, index) => {
                        const extraClass = (index % 3 === 2) ? 'lg:mt-12' : '';
                        // Fix path gambar untuk local uploads
                        const imgSrc = item.image.startsWith('http') ? item.image : `/${item.image}`;
                        
                        return `
                        <div class="group relative aspect-[3/4] overflow-hidden bg-gray-200 cursor-pointer ${extraClass}">
                            <img src="${imgSrc}" alt="${item.category}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105 grayscale group-hover:grayscale-0">
                            <div class="absolute inset-0 image-overlay opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex flex-col justify-end p-8 text-white">
                                <span class="text-xs uppercase tracking-widest mb-2">${item.category}</span>
                                <h3 class="font-serif text-2xl">${item.title}</h3>
                            </div>
                        </div>
                        `;
                    }).join('');
                }, 800);
            } catch (err) {
                grid.innerHTML = `<p class="text-red-500 text-xs uppercase tracking-widest">${err.message}</p>`;
            }
        }
        document.addEventListener('DOMContentLoaded', fetchPortfolio);

        // Netlify Identity Login Helper
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
                }
            });
        }
    </script>
    <!-- WA Button -->
    <a href="https://wa.me/6287835421047" class="fixed bottom-6 right-6 bg-[#25D366] text-white p-4 rounded-full shadow-lg z-50">
        <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.347-.272.273-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
    </a>
</body>
</html>
